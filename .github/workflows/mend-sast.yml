name: Mend SAST

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Mend CLI
        run: |
          curl -fL https://downloads.mend.io/cli/linux_amd64/mend -o /usr/local/bin/mend
          chmod +x /usr/local/bin/mend

      - name: Run Mend SAST scan
        env:
          MEND_EMAIL: ${{ secrets.MEND_EMAIL }}
          MEND_USER_KEY: ${{ secrets.MEND_USER_KEY }}
          MEND_URL: https://saas.whitesourcesoftware.com
          MEND_ORGANIZATION: 9f3c7c20-97f2-4b3a-b829-bdd9fb9686b8
        run: |
          mend code --non-interactive \
            --scope "G-Gravity_Demo//Arisa-Test//mend_test" \
            --report --formats sarif --filename mend-sast

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: mend-sast.sarif
